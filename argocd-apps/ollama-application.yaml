apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/vadimdddd/semantic-layer-gitops.git'
    targetRevision: main
    path: gitops/apps/ollama 
    helm: {}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-models
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
