apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: semantic-layer-environments
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - environments:
              values:
                - dev
                - prod
          - applications:
              values:
                - name: ollama
                  path: gitops/apps/ollama
                - name: monitoring
                  path: gitops/apps/monitoring
  template:
    metadata:
      name: 'semantic-layer-{{applications.name}}-{{environments}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/vadimdddd/semantic-layer-gitops.git'
        targetRevision: main
        path: '{{applications.path}}' 
        helm:
          valueFiles:
            - "values.yaml"
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{applications.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
