apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: semantic-layer-environments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
            path: gitops/environments/dev
          - environment: prod
            path: gitops/environments/prod
  template:
    metadata:
      name: 'semantic-layer-{{environment}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/vadimdddd/semantic-layer-gitops.git'
        targetRevision: main
        path: '{{path}}'
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{environment}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
